version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_canvas_backend
    ports:
      - "8000:8000"
    volumes:
      - drawings_storage:/app/drawings
    environment:
      - PYTHONUNBUFFERED=1
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_canvas_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always

volumes:
  drawings_storage:
